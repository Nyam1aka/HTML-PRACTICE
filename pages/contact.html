<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="../style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
</head>
<body>

    <div class="container">
        <div class="form_area">
            <p class="title">CONTACT ME</p>
            <form action="" method="">

                <div class="form_group">
                    <label class="sub_title" for="first-name">First name</label>
                    <input  type="text" placeholder="Enter your first name" class="form_style" id="first-name">
                </div>

                <div class="form_group">
                    <label class="sub_title" for="last-name">Last name</label>
                    <input type="text" placeholder="Enter your last name" class="form_style" id="last-name">
                </div>

                <div class="form_group">
                    <label class="sub_title" for="email">Email</label>
                    <input  type="email" placeholder="Enter your email" id="email" class="form_style" >
                </div>

                <div class="input-section"> 
                    <input type="radio" name="office" id="office" class="radio_style" placeholder="office">
                    <label class="sub_title" for="office">Office</label>

                    <input type="radio" name="remote" id="remote"  placeholder="remote">
                    <label class="sub_title" for="remote">Remote</label>

                    <input type="radio" name="other" id="other" class="radio_style" placeholder="other">
                    <label class="sub_title" for="other">Other</label>
                </div>

                <div class="input-section">
                    <input type="checkbox" name="contract" id="contract" placeholder="contract">
                    <label class="sub_title" for="contract">Contract work</label>

                    <input type="checkbox" name="full-time" id="full-time" placeholder="full-time">
                    <label class="sub_title" for="full-time">Full time</label>

                    <input type="checkbox" name="sponsorship" id="sponsorship" placeholder="sponsorship">
                    <label class="sub_title" for="sponsorship">Sponsorship</label>
                </div>

                <div>
                    <button class="btn">SUBMIT</button>    
                </div>
            
            </form>
        </div>
    </div>
</body>
</html>
